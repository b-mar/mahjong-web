<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>🀄💥💸</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@500;600;700&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Rainfall design system: tokens + reusable component classes -->
  <link rel="stylesheet" href="colors_and_type.css" />
  <link rel="stylesheet" href="components.css" />

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- Rainfall line-chart component -->
  <script src="line-chart.js?v=11"></script>

  <style>
    /* Page-level rules only. Components live in components.css. */

    body {
      font-family: var(--font-body);
      margin: 0;
      padding: 0;
      background: var(--color-background);
      color: var(--color-text-primary);
      line-height: var(--line-height-relaxed);
    }

    header {
      display: flex;
      align-items: center;
      padding: var(--space-md) var(--space-xl);
      background: var(--color-surface);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      flex: 1;
      text-align: center;
      font-family: var(--font-display);
      font-size: 28px;
      letter-spacing: 0.04em;
      margin: 0;
      color: var(--color-text-primary);
    }

    header img {
      border-radius: 50%;
      object-fit: cover;
      height: 48px;
      width: 48px;
      margin-right: var(--space-md);
    }

    header .header-actions { display: flex; gap: var(--space-sm); }

    main {
      padding: var(--space-md) var(--space-lg);
      max-width: 960px;
      margin: 0 auto;
    }

    main .section + .section { margin-top: var(--space-md); }

    h2 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 20px;
      margin: 0 0 var(--space-sm);
      color: var(--color-text-primary);
    }

    h3 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 16px;
      margin: var(--space-xs) 0;
      color: var(--color-text-primary);
    }

    .actions-row { display: flex; gap: var(--space-sm); flex-wrap: wrap; }

    /* Stats tables don't have a totals row — undo the last-child bold/bg */
    #gameStatsTable tr:last-child td,
    #masterStatsTable tr:last-child td {
      font-weight: normal;
      background: none;
    }
    #gameStatsTable tr:last-child td:first-child,
    #masterStatsTable tr:last-child td:first-child {
      color: var(--color-text-secondary);
    }

    /* =================================================================
       Self-draw celebration burst
       ================================================================= */
    @keyframes sd-fly {
      0%   { transform: translate(-50%, -50%) rotate(0deg) scale(1); opacity: 1; }
      65%  { opacity: 1; }
      100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)) scale(0.5); opacity: 0; }
    }
    @keyframes sd-btn-flash {
      0%   { transform: scale(1)    translateY(0); }
      35%  { transform: scale(1.2)  translateY(-3px); }
      65%  { transform: scale(0.95) translateY(0); }
      100% { transform: scale(1)    translateY(0); }
    }
    .sd-particle {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      font-size: var(--size);
      line-height: 1;
      user-select: none;
      white-space: nowrap;
      animation: sd-fly var(--dur) cubic-bezier(0.12, 0.82, 0.3, 1) var(--delay) both;
      will-change: transform, opacity;
    }
    .sd-particle.is-label {
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--color-walnut);
      background: var(--color-golden);
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      box-shadow: var(--shadow-accent);
    }
    .btn.sd-btn-flash {
      animation: sd-btn-flash 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards !important;
    }

    /* =================================================================
       History table — scroll + expand/collapse
       ================================================================= */
    .table-scroll-wrap {
      overflow-x: auto;
      margin-top: var(--space-md);
    }
    .table-scroll-wrap.is-expanded {
      max-height: 340px;
      overflow-y: auto;
    }
    .table-scroll-wrap.is-expanded .data-table tr:last-child td {
      position: sticky;
      bottom: 0;
      background: #f5f5f5;
    }

    /* =================================================================
       History stat cards
       ================================================================= */
    .stat-cards-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-md);
      margin: var(--space-md) 0;
    }

    .stat-card {
      background: var(--color-white);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-md);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .stat-card__title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--color-text-secondary);
      margin-bottom: var(--space-sm);
    }

    .stat-card__value {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(20px, 5.5vw, 40px);
      line-height: 1;
      color: var(--color-walnut);
    }

    .stat-card__name {
      font-size: clamp(9px, 2vw, 12px);
      color: var(--color-text-secondary);
      margin-top: var(--space-xs);
    }

    /* Mobile */
    @media (max-width: 640px) {
      header { padding: var(--space-md); }
      main { padding: var(--space-md); }
      .stat-cards-row { gap: var(--space-xs); }
      .stat-card { padding: var(--space-sm) var(--space-xs); }
      .stat-card__title { font-size: 8px; letter-spacing: 0.04em; margin-bottom: 4px; }
    }
  </style>
</head>
<body>
  <header>
    <img src="Molly.jpeg" alt="Molly" />
    <h1>🀄💥💸</h1>
    <div class="header-actions">
      <button id="undoBtn" class="btn btn-secondary btn-sm">Undo</button>
      <button id="tabGame" class="btn btn-secondary btn-sm">Game</button>
      <button id="tabHistory" class="btn btn-secondary btn-sm">History</button>
    </div>
  </header>

  <main>
    <!-- GAME TAB -->
    <section id="gameTab">
      <div class="section">
        <div class="actions-row">
          <button id="newGameBtn" class="btn btn-primary">New Game</button>
          <button id="appendHistoryBtn" class="btn btn-accent">Add to History</button>
        </div>
      </div>

      <div class="section" id="addPlayerSection">
        <h2>Add Player</h2>
        <div class="actions-row">
          <input type="text" id="newPlayer" class="input" placeholder="Name" list="playerSuggestions" autocomplete="off" />
          <datalist id="playerSuggestions"></datalist>
          <button id="addPlayerBtn" class="btn btn-primary">Add</button>
        </div>
      </div>

      <div class="section" id="scoreEntrySection">
        <h2>Enter Scores (Round <span id="roundNum">1</span>)</h2>
        <div id="scoreInputs"></div>
        <button id="submitBtn" class="btn btn-primary">Submit</button>
      </div>

      <div class="section" id="chartSection">
        <h2>Chart</h2>
        <div id="chartCanvas" class="chart-host"></div>
      </div>

      <div class="section" id="historySection">
        <h2>Rounds</h2>
        <div id="historyControls" class="actions-row">
          <button id="editHistoryBtn" class="btn btn-secondary btn-sm">Edit</button>
          <button id="saveHistoryBtn" class="btn btn-secondary btn-sm" style="display:none;">Save</button>
        </div>
        <table id="historyTable" class="data-table"></table>
      </div>

      <div class="section">
        <h2>Statistics</h2>
        <table id="gameStatsTable" class="data-table"></table>
      </div>
    </section>

    <!-- HISTORY TAB -->
    <section id="historyTab" style="display:none;">
      <div class="section">
        <h2>All Time History</h2>
      </div>

      <div class="stat-cards-row">
        <div class="stat-card">
          <div class="stat-card__title">Most Wins</div>
          <div class="stat-card__value" id="statMostWinsValue">—</div>
          <div class="stat-card__name" id="statMostWinsName">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-card__title">Biggest Hand</div>
          <div class="stat-card__value" id="statBiggestHandValue">—</div>
          <div class="stat-card__name" id="statBiggestHandName">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-card__title">Most Consecutive Wins</div>
          <div class="stat-card__value" id="statConsecWinsValue">—</div>
          <div class="stat-card__name" id="statConsecWinsName">—</div>
        </div>
      </div>

      <div class="section">
        <h3>History Chart</h3>
        <div id="masterChartCanvas" class="chart-host"></div>

        <div id="masterHistoryControls" class="actions-row" style="margin-top: var(--space-md);">
          <button id="editMasterBtn" class="btn btn-secondary btn-sm">Edit</button>
          <button id="saveMasterBtn" class="btn btn-secondary btn-sm" style="display:none;">Save</button>
          <button id="masterTableToggleBtn" class="btn btn-secondary btn-sm">Show all rounds ↓</button>
        </div>

        <div class="table-scroll-wrap">
          <table id="masterHistoryTable" class="data-table"></table>
        </div>
      </div>

      <div class="section">
        <h2>Statistics</h2>
        <table id="masterStatsTable" class="data-table"></table>
      </div>
    </section>
  </main>

  <script src="script.js?v=11"></script>
</body>
</html>
